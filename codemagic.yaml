Voici le fichier complet, avec Java 21 — copie-colle tout dans `codemagic.yaml` :

```yaml
workflows:
  ios-vrai-riche:
    name: Vrai Riche - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_api_key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.maxime.vrairiche
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Add iOS platform (first run only)
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
      - name: Sync web assets into the native project
        script: npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts: ["build/ios/ipa/*.ipa"]
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-vrai-riche:
    name: Vrai Riche - Android
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - vrai_riche_keystore
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "com.maxime.vrairiche"
      node: latest
      java: 21
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Add Android platform (first run only)
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Sync web assets into the native project
        script: npx cap sync android
      - name: Configure Android release signing
        script: |
          python3 - <<'EOF'
          import re
          path = "android/app/build.gradle"
          with open(path) as f:
              content = f.read()

          signing_configs = '''
              signingConfigs {
                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
          '''
          if "signingConfigs {" not in content:
              content = content.replace("android {", "android {\n" + signing_configs, 1)

          if "signingConfig signingConfigs.release" not in content:
              content = re.sub(
                  r'(buildTypes\s*\{\s*release\s*\{)',
                  r'\1\n            signingConfig signingConfigs.release',
                  content
              )

          with open(path, "w") as f:
              f.write(content)
          print("build.gradle patched for release signing")
          EOF
      - name: Build signed .aab
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts: ["android/app/build/outputs/**/*.aab"]
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_CREDENTIALS
        track: internal
```

Colle ça, "Commit changes", relance le build.
